# Production compose for the c3-panel backend. Single service on purpose --
# see the Dockerfile's closing comment on why this must stay one container
# (extraction/state.py's last-run cache + refresh lock are in-memory, so a
# second replica would have its own independent copy of both).
#
# Credentials: config.py's load_credentials() reads a literal `.env` FILE at
# the project root (PROJECT_ROOT/.env, == /app/.env in the image) via
# python-dotenv's dotenv_values() -- it never falls back to the process's
# real environment variables (see backend/CLAUDE.md's "pydantic-settings"
# note: this is deliberate, not an oversight). That means the usual compose
# `environment:`/`env_file:` keys are NOT enough here -- they only set
# process env vars, and this app ignores those on purpose. The bind mount
# below is what actually gets C3_USERNAME/C3_PASSWORD into the container:
# keep managing backend/.env exactly as documented in CLAUDE.md's "Setup"
# section (copied from .env.example, gitignored), it now also gets read by
# the container at the same relative spot.
services:
  backend:
    build: .
    image: c3-panel-backend:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./.env:/app/.env:ro
      - downloads:/app/downloads
      - state:/app/state

volumes:
  downloads:
  state:
